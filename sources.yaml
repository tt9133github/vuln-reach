# 告警源配置：固定仓库列表
# fetch_alerts.py 按此列表拉取 GitHub Dependabot 告警，缓存到 workspace/raw/dependabot/
# 新增告警源只需在 repos 下加一项，无需改代码
github:
  token_env: GITHUB_TOKEN        # token 从环境变量或项目根目录 .env 读取
  api_version: "2022-11-28"

repos:
  - owner: tt9133github
    repo: mvntree-util
    ecosystem: maven
    branch: master
    commit: d253e2585d9cc702037b43edb7cff5752a1281bc
