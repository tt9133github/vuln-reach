syntax = "proto3";
package vulnreach.v1;

service VulnReachService {
  rpc BuildRepositoryEvidence(BuildRepositoryEvidenceRequest) returns (BuildRepositoryEvidenceResponse);
  rpc CheckReachability(CheckReachabilityRequest) returns (CheckReachabilityResponse);
}

message BuildRepositoryEvidenceRequest {}

message BuildRepositoryEvidenceResponse {
  string snapshot_id = 1 [json_name = "snapshotId"];
  string repository = 2;
  string resolved_commit = 3 [json_name = "resolvedCommit"];
  string collected_at = 4 [json_name = "collectedAt"];
  int32 alert_count = 5 [json_name = "alertCount"];
  int32 dependency_count = 6 [json_name = "dependencyCount"];
  int32 source_file_count = 7 [json_name = "sourceFileCount"];
  string input_captured_at = 8 [json_name = "inputCapturedAt"];
}

message CheckReachabilityRequest {
  oneof selector {
    string cve_id = 1 [json_name = "cveId"];
    int32 alert_number = 2 [json_name = "alertNumber"];
  }
  string snapshot_id = 3 [json_name = "snapshotId"];
}

message CheckReachabilityResponse {
  string cve_id = 1 [json_name = "cveId"];
  string ghsa_id = 2 [json_name = "ghsaId"];
  string package = 3;
  string installed_version = 4 [json_name = "installedVersion"];
  string affected_versions = 5 [json_name = "affectedVersions"];
  string verdict = 6;
  string confidence = 7;
  string reason = 8;
  repeated EvidenceItem evidence = 9;
  repeated string fix = 10;
  int32 alert_number = 11 [json_name = "alertNumber"];
  string rule_id = 12 [json_name = "ruleId"];
  string fixed_version = 13 [json_name = "fixedVersion"];
  string source_commit = 14 [json_name = "sourceCommit"];
  string scope = 15;
  repeated string limitations = 16;
  ReachabilityChecks checks = 17;
  string snapshot_id = 18 [json_name = "snapshotId"];
  string reachability_level = 19 [json_name = "reachabilityLevel"];
  string level_reason = 20 [json_name = "levelReason"];
  string governance_action = 21 [json_name = "governanceAction"];
  ReachabilityLevelChecks level_checks = 22 [json_name = "levelChecks"];
}

message ReachabilityLevelChecks {
  string component_usage = 1 [json_name = "componentUsage"];
  string dangerous_sink = 2 [json_name = "dangerousSink"];
  string external_input_to_sink = 3 [json_name = "externalInputToSink"];
  string complete_attack_path = 4 [json_name = "completeAttackPath"];
}

message ReachabilityChecks {
  string version_match = 1 [json_name = "versionMatch"];
  string sink_present = 2 [json_name = "sinkPresent"];
  repeated CheckResult preconditions = 3;
}

message CheckResult {
  string id = 1;
  string status = 2;
}

message EvidenceItem {
  string rule_id = 1 [json_name = "ruleId"];
  string check = 2;
  string detail = 3;
  string status = 4;
  string file = 5;
  int32 line = 6;
  string observed = 7;
  string expected = 8;
}
