schema_version: verdict-policy/2.0

# 企业开源治理口径：等级表示“在本企业证据中最高已证实的攻击链阶段”，
# 不替代 CVSS，也不把 unknown（证据不足）伪装成低风险。
reachability_levels:
  principle: "highest_proven_attack_chain_stage"
  applicability: "仅在权威依赖清单确认安装版本命中漏洞区间后分级；版本不命中为 NA"
  unknown: "扫描完整性或必要证据不足时保持 unknown，不得因未发现证据自动降级"
  levels:
    L0:
      definition: "漏洞组件版本存在，但完整源码扫描未发现组件使用"
      minimum_evidence: "版本命中；组件使用扫描完整；组件导入、调用和危险函数均未发现"
      governance_action: "记录后降级处置，并评估移除未使用依赖"
    L1:
      definition: "组件使用已确认，尚未证明调用路径到达危险函数"
      minimum_evidence: "存在组件导入或普通 API 调用证据；无危险函数命中证据"
      governance_action: "常规治理；保留扫描完整性证据并关注后续代码变化"
    L2:
      definition: "危险函数调用已确认，尚未证明危险参数来自外部输入"
      minimum_evidence: "危险函数调用具备文件与行号；外部输入到 sink 的数据流未建立"
      governance_action: "进入专项复核，检查真实入口、调用者和跨层数据流"
    L3:
      definition: "分析边界外的调用者可控输入到达危险函数，但完整利用前提尚未全部成立"
      minimum_evidence: "应用项目可由 HTTP、消息、文件等入口证明；库项目可由 public API 参数到 sink 的数据流证明。公网暴露、配置、gadget、网络、权限等完整条件不要求在本级全部成立"
      governance_action: "高优先级整改并核查配置、gadget、网络与权限条件"
    L4:
      definition: "漏洞版本、外部入口、危险函数及规则声明的全部利用前提形成完整攻击路径"
      minimum_evidence: "L3 证据成立；漏洞特定前置条件全部通过；证据可追溯"
      governance_action: "按紧急事件处置：立即缓解、升级并验证攻击路径已阻断"

governance_guardrails:
  policy_basis: "企业内部开源治理实践抽象；用于批量 SCA 告警分流，不冒充漏洞公开事实"
  downgrade_requirements:
    - "L0 必须有版本命中证据和完整组件使用扫描，不能用简单字符串搜索的未命中代替"
    - "L1/L2 的较低阶段表示边界输入到危险函数的数据流尚未证实，不表示漏洞不存在；CVSS、资产重要性和互联网暴露标签必须保留"
    - "库项目 public API 参数可控可以进入 L3，但不得据此声称公网暴露或完整攻击路径成立"
    - "L3 因 JNDI、gadget、出网、权限等补偿控制降低处置优先级时，控制证据必须包含配置来源、采集时间和适用实例"
  reevaluation_triggers:
    - "依赖版本、调用代码、入口暴露、运行配置、容器镜像或网络策略发生变化"
    - "出现新的绕过方式、gadget 或供应链情报，使既有前置条件失效"
  audit_fields:
    - "rule_id"
    - "snapshot_id"
    - "source_commit"
    - "文件与行号"
    - "等级阶段检查"
    - "限制与治理动作"

verdicts:
  reachable:
    definition: "在规则声明的判定边界内：版本命中 + sink 存在 + 全部前置条件满足"
  not_reachable:
    definition: "版本未命中，或 sink 不存在，或任一前置条件明确不满足"
  unknown:
    definition: "任何必要证据缺失、版本/约束不可解析或扫描完整性不足时，保守判为 unknown"

confidence:
  high: "判定依赖的证据均为文件/行号级别事实"
  medium: "部分证据为推断（如入口来源）"
  low: "仅版本命中，其余证据不足"

notes:
  - "CVSS 描述漏洞固有严重性；Level 0-4 描述该漏洞在当前资产中的攻击链成熟度；两者必须同时保留"
  - "等级越高表示已证实的攻击链更完整，不单独等价于业务风险；资产价值、暴露面和补偿控制仍需另行评估"
