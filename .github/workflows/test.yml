name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: octobus/package-lock.json
      - run: pip install -r guest/requirements.txt
      - run: npm ci
        working-directory: octobus
      - run: python -m unittest discover -s tests -v
      - run: npm test
        working-directory: octobus
        env:
          VULN_REACH_LIVE_SOURCE: "1"
      - run: python -m py_compile workspace/scripts/reachability.py workspace/scripts/run_pipeline.py scripts/fetch_alerts.py scripts/normalize.py
      - run: node --check octobus/bin/vuln-reach.js && node --check octobus/lib/snapshot.js
      - run: bash -n run.sh scripts/*.sh
