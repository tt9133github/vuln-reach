name: vuln-reach

agents:
  reach-analyzer:
    provider: opencode
    model: agent-compose/deepseek-v4-flash
    image: vuln-reach-guest:v1.0.0
    build:
      context: ./guest
      dockerfile: Dockerfile
    driver:
      docker: {}
    env:
      OPENCODE_MODEL: agent-compose/deepseek-v4-flash
      VULN_REACH_ROOT: /workspace
    workspace:
      provider: local
      path: ./workspace
    volumes:
      # local workspace is an isolated run snapshot; share runtime read-only and persist reports explicitly.
      - type: bind
        source: ./workspace/runtime
        target: /workspace/runtime
        read_only: true
      - type: bind
        source: ./workspace/report
        target: /workspace/report
        read_only: false
    capset_ids:
      - vulnreach
    system_prompt: |
      你是组件漏洞可达性研判与修复闭环 Agent。数据采集、依赖解析、源码扫描和最终判定均由确定性代码完成；你只负责执行闭环、核对结果并把结构化证据整理为可读报告，禁止自行编造结论。

      每次运行必须严格执行：
      1. 阅读 /data/runtime/mpi/catalog.md，确认能力网关调用方式。
      2. 只用 `test -n "${CAP_TOKEN:-}"` 检查沙箱 Token，禁止打印 Token 或执行 `env | grep CAP`。
      3. 运行 `python3 /workspace/scripts/run_pipeline.py`。该脚本会先通过 OctoBus 调用 BuildRepositoryEvidence，校验仓库内固定的真实 Dependabot 告警输入，获取固定 commit 的公开源码并由代码重新解析依赖和使用证据，生成不可变快照；随后对每条告警调用 CheckReachability，由 OctoBus 输出唯一的确定性判定。
      4. 阅读 /workspace/report/snapshot.json、verdicts.json、reachability-report.md，以及当前快照的 provenance.json。只在解释证据确有必要时读取报告引用的少量源码行，不要把整个工程发送给模型。
      5. 输出 /workspace/report/agent-report.md。每条告警必须包含 CVE/GHSA、状态、依赖及版本、最终判定、置信度、rule_id、snapshot_id、source commit、文件行号证据、限制和修复建议。
      6. 不得自行改写 verdicts.json 中由 OctoBus 生成的确定性判定；证据不足时保留能力返回的 unknown。

      判定含义：reachable 表示版本、危险 sink 和全部利用前置条件都有证据；not_reachable 表示至少一个必要条件有完整反证；unknown 表示证据不完整或解析失败。组件 public API 参数可达不等于公网暴露，也不等于已验证利用成功。
    scheduler:
      enabled: true
      triggers:
        - name: daily-reachability
          # Agent-Compose v2607.10.0 的声明式 cron 使用 UTC；19:00 UTC = 北京时间次日 03:00。
          cron: "0 19 * * *"
          prompt: "立即运行 python3 /workspace/scripts/run_pipeline.py，读取本次真实快照和 OctoBus 判定结果，并按系统要求生成 /workspace/report/agent-report.md。不要只回复计划。"
