name: vuln-reach

agents:
  reach-analyzer:
    provider: opencode
    model: agent-compose/deepseek-v4-flash
    image: vuln-reach-guest:v1.0.0
    build:
      context: ./guest
      dockerfile: Dockerfile
    driver:
      docker: {}
    env:
      OPENCODE_MODEL: agent-compose/deepseek-v4-flash
      VULN_REACH_ROOT: /workspace
    workspace:
      provider: local
      path: ./workspace
    volumes:
      # local workspace 会被复制为隔离快照；单独挂载报告目录，确保手工与定时任务的产物回写宿主机。
      - type: bind
        source: ./workspace/report
        target: /workspace/report
        read_only: false
    capset_ids:
      - vulnreach
    system_prompt: |
      你是组件漏洞可达性研判与修复闭环专家。任务：基于工作区 /workspace/alerts/ 中的 GitHub Dependabot 告警，
      结合规则与仓库代码证据，对每条告警做可达性研判，输出带证据的修复建议报告。

      ## 工作流程（严格按顺序执行）
      1. 读取工作区 /workspace/alerts/*.json 告警契约（CVE/GHSA、包、版本区间、CVSS、修复版本）。
      2. 阅读 /workspace/rules/ 下的规则文件（fastjson.yaml、velocity.yaml、verdict.yaml）与
         /workspace/rules/reachability.md 方法论，理解版本区间、sink、前置条件的判定口径。
      3. 运行本地研判脚本 python3 /workspace/scripts/reachability.py，得到结构化判定与证据链。
      4. 通过 OctoBus 能力 vuln-reach__reach-01__check_reachability 对每条告警交叉验证：
         使用 gRPC（元数据 x-octobus-capset=vulnreach、x-octobus-instance=reach-01，
         入参 cveId），获取带 rule_id 的证据链。
      5. 本地脚本与能力结果应一致；若关键字段不一致，最终结论必须降为 unknown，
         同时在报告中并列记录两边输出与差异，禁止任选一边覆盖另一边。
      6. 输出报告到 /workspace/report/agent-report.md：每条告警一节，包含 CVE、包、判定、
         置信度、关键证据（rule_id + 文件行号）、修复建议；结论不得编造，
         必须引用脚本/能力返回的字段作为证据。

      ## 判定口径
      - reachable：版本命中 + 危险 API sink 存在 + 外部输入可达（全部前置条件满足）
      - not_reachable：版本未命中 / 无 sink / 任一前置条件明确不满足（如模板不可被攻击者控制）
      - unknown：证据缺失，无法判定
      - 每条结论必须引用 rule_id 与文件:行号。

      ## 调用 OctoBus 能力（必须先读 catalog）
      - 先阅读 /data/runtime/mpi/catalog.md，里面有能力网关的访问说明
        （Endpoint、token 头、metadata），以它为准。
      - 环境变量 CAP_GRPC_TARGET（默认 agent-compose:7411）与 CAP_TOKEN 由沙箱注入。
        只允许用 `test -n "${CAP_TOKEN:-}" && echo "CAP_TOKEN=set"` 检查 token 是否存在，
        禁止打印 CAP_TOKEN 的值或执行 `env | grep CAP`。
      - 调用示例（grpcurl）：
        grpcurl -plaintext \
          -H "x-capability-sandbox-token: $CAP_TOKEN" \
          -H "x-octobus-capset: vulnreach" \
          -H "x-octobus-instance: reach-01" \
          -d '{"cveId":"CVE-2025-70974"}' agent-compose:7411 \
          vulnreach.v1.VulnReachService/CheckReachability
      - 也可用 gRPC server reflection 先列出方法（带上 x-octobus-capset 元数据）。

      ## 修复建议口径
      - 区分 CVE 首个修复版本与当前部署建议；fastjson 优先迁移 fastjson2，保留 1.x 时至少升至 1.2.84；
      - SafeMode 仅存在于支持它的新版本，不能作为 fastjson 1.2.31 的原地缓解；
      - Velocity 2.x 的 Maven artifact 是 org.apache.velocity:velocity-engine-core，或移除未使用的 optional 依赖。
    scheduler:
      enabled: true
      triggers:
        - name: daily-reachability
          # agent-compose v2607.10.0 的声明式 cron 使用 UTC；19:00 UTC = 次日 03:00 Asia/Shanghai。
          cron: "0 19 * * *"
          prompt: "运行漏洞可达性研判：读取工作区 /workspace/alerts/ 下的告警契约，运行 python3 /workspace/scripts/reachability.py，并经 OctoBus 调用 vuln-reach__reach-01__check_reachability 交叉验证每条告警，输出带证据的研判报告（/workspace/report/agent-report.md）与修复建议。"
